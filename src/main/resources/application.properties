spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:file:./muskelmanagement
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Logging Configuration
logging.level.root=INFO
logging.level.de.oth.muskelmanagement=DEBUG
logging.file.name=application.log

# Mail Configuration (Mailtrap for Development)
# Replace with your Mailtrap credentials from https://mailtrap.io
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 2FA Configuration
app.2fa.code-validity-minutes=5
app.2fa.max-attempts=3
app.mail.from=noreply@muskelmanagement.de

# PDF Generation Configuration
pdf.storage.path=pdf-confirmations
pdf.storage.enabled=true

# ExerciseDB API Configuration
# Note: Get your free API key from https://rapidapi.com/justin-WFnsXH_t6/api/exercisedb
# Add your API key below (optional - the app will work without exercises if not provided)
exercisedb.api.key=${EXERCISEDB_API_KEY:}
# Image configuration - GIFs are fetched from a separate endpoint
exercisedb.api.image-base-url=https://exercisedb.p.rapidapi.com/image
exercisedb.api.image-resolution=720

# PayPal Configuration
# Get your credentials from https://developer.paypal.com
# App > Sandbox > Create App > Copy Client ID and Secret
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.mode=sandbox
paypal.return-url=http://localhost:8080/member/payment/return
paypal.cancel-url=http://localhost:8080/member/payment/cancel

# Stripe Configuration
# Set your Stripe publishable key (use test key in development)
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# Error Page Configuration
server.error.include-message=always
server.error.include-binding-errors=always

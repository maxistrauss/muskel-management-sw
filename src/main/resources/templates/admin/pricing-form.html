<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pricing Form</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<!-- Include Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
<div class="container mx-auto mt-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold mb-6" th:if="${pricing.id == null}">Create Subscription</h1>
        <h1 class="text-3xl font-bold mb-6" th:if="${pricing.id != null}">Edit Subscription</h1>
        <form method="post"
              th:action="${pricing.id == null} ? @{/admin/pricing/new} : @{/admin/pricing/edit/{id}(id=${pricing.id})}" th:object="${pricing}">

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="name">Name:</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                       id="name" th:field="*{name}" type="text"/>
                <span class="text-red-500 text-xs italic" th:errors="*{name}"
                      th:if="${#fields.hasErrors('name')}"></span>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="price">Price (€):</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                       id="price" th:field="*{price}" type="number" step="0.01" min="0.01"/>
                <span class="text-red-500 text-xs italic" th:errors="*{price}"
                      th:if="${#fields.hasErrors('price')}"></span>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="durationMonths">Duration (Months):</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                       id="durationMonths" th:field="*{durationMonths}" type="number" min="1"/>
                <span class="text-red-500 text-xs italic" th:errors="*{durationMonths}"
                      th:if="${#fields.hasErrors('durationMonths')}"></span>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="description">Description:</label>
                <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                          id="description" th:field="*{description}" rows="4"></textarea>
                <span class="text-red-500 text-xs italic" th:errors="*{description}"
                      th:if="${#fields.hasErrors('description')}"></span>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">
                    <input class="mr-2 leading-tight" th:field="*{active}" type="checkbox"/>Active
                </label>
            </div>
            <div>
                <input class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" th:value="${pricing.id == null} ? 'Create Subscription' : 'Update Subscription'"
                       type="submit"/>
            </div>
        </form>
    </div>
</div>
</body>
</html>

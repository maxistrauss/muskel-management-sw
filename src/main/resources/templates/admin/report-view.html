<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Report</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
    <div class="container mx-auto p-8">

        <div class="mb-6 flex justify-between items-center">
            <div>
                <a class="text-blue-600 hover:underline mb-2 inline-block" href="/admin/reports">&larr; Back to
                    Reports</a>
                <h1 class="text-3xl font-bold text-gray-800" th:text="${report.name}">Report Name</h1>
                <p class="text-gray-500">
                    Type: <span th:text="${report.type}"></span> |
                    Generated: <span
                        th:text="${#temporals.format(T(java.time.LocalDateTime).now(), 'dd.MM.yyyy HH:mm')}"></span>
                </p>
            </div>
            <div>
                <a class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded"
                   th:href="@{/admin/reports/edit/{id}(id=${report.id})}">
                    Edit Configuration
                </a>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Chart Card -->
            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4 text-gray-700">Visualization</h2>
                <canvas id="reportChart"></canvas>
            </div>

            <!-- KPI / Details Card -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4 text-gray-700">Key Figures</h2>
                <div class="space-y-4">
                    <div class="p-4 bg-blue-50 rounded border border-blue-100" th:if="${report.course != null}">
                        <span class="block text-sm text-blue-600 font-bold uppercase">Specific Course</span>
                        <span class="text-lg text-gray-800" th:text="${report.course.name}"></span>
                    </div>

                    <div class="p-4 bg-gray-50 rounded border border-gray-200">
                        <span class="block text-sm text-gray-600 font-bold uppercase">Data Points</span>
                        <span class="text-2xl font-bold text-gray-800" th:text="${chartData.data.size()}">0</span>
                    </div>

                    <!-- Dynamic Table of Data -->
                    <div class="mt-4">
                        <h3 class="font-bold text-gray-700 mb-2 border-b pb-1">Data Table</h3>
                        <table class="w-full text-sm text-left">
                            <thead>
                            <tr>
                                <th class="py-1">Label</th>
                                <th class="py-1 text-right">Value</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="val, iter : ${chartData.data}">
                                <td class="py-1 border-b border-gray-100"
                                    th:text="${chartData.labels[iter.index]}"></td>
                                <td class="py-1 border-b border-gray-100 text-right font-mono" th:text="${val}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const chartLabels = /*[[${chartData.labels}]]*/ [];
    const chartValues = /*[[${chartData.data}]]*/ [];
    const chartLabel = /*[[${chartData.label}]]*/ 'Data';
    const reportType = /*[[${report.type}]]*/ 'BAR';

    const ctx = document.getElementById('reportChart').getContext('2d');

    // Determine chart type based on report type or data shape
    let chartType = 'bar';
    let chartOptions = {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    };

    if (reportType === 'MEMBER_STATISTICS') {
        chartType = 'pie';
        chartOptions.scales = {}; // Hide scales for pie chart
    } else if (reportType === 'TRAINER_POPULARITY') {
        chartType = 'bar';
    } else if (reportType === 'MEMBER_GROWTH') {
        chartType = 'line';
    } else if (reportType === 'POPULAR_COURSES') {
        chartType = 'bar';
        chartOptions.indexAxis = 'y'; // Horizontal bar chart
    } else if (reportType === 'COURSE_UTILIZATION' && chartValues.length <= 1) {
        // If single course or no data, bar is fine
    }

    new Chart(ctx, {
        type: chartType,
        data: {
            labels: chartLabels,
            datasets: [{
                label: chartLabel,
                data: chartValues,
                backgroundColor: [
                    'rgba(54, 162, 235, 0.6)',
                    'rgba(75, 192, 192, 0.6)',
                    'rgba(255, 206, 86, 0.6)',
                    'rgba(255, 99, 132, 0.6)',
                    'rgba(153, 102, 255, 0.6)',
                    'rgba(255, 159, 64, 0.6)'
                ],
                borderColor: [
                    'rgba(54, 162, 235, 1)',
                    'rgba(75, 192, 192, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(255, 99, 132, 1)',
                    'rgba(153, 102, 255, 1)',
                    'rgba(255, 159, 64, 1)'
                ],
                borderWidth: 1
            }]
        },
        options: chartOptions
    });
    /*]]>*/
</script>

</body>
</html>

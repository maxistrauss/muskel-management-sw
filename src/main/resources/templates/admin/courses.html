<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Management</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
<div class="container mx-auto mt-8">
    <div class="max-w-7xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Course Management</h1>
            <a class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" href="/admin/courses/new">Add Course</a>
        </div>

        <!-- Filter by Trainer -->
        <div class="mb-6">
            <form method="get" action="/admin/courses" class="flex gap-2 items-end">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Filter by Trainer:</label>
                    <select name="trainerId" class="border rounded px-3 py-2 text-sm">
                        <option value="">-- All Trainers --</option>
                        <option th:each="trainer : ${trainers}" 
                                th:value="${trainer.id}" 
                                th:text="${trainer.firstName} + ' ' + ${trainer.lastName}"
                                th:selected="${selectedTrainerId != null && selectedTrainerId == trainer.id}"></option>
                    </select>
                </div>
                <button type="submit" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded text-sm">Filter</button>
                <a href="/admin/courses" class="bg-gray-400 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded text-sm">Reset</a>
            </form>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Course Name</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Trainer</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Schedule</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-center">Actions</th>
                    </tr>
                </thead>
                <tbody class="text-gray-700">
                    <tr th:each="course : ${courses}" class="border-b hover:bg-gray-50">
                        <td class="py-4 px-4">
                            <div class="font-semibold" th:text="${course.name}"></div>
                            <div class="text-xs text-gray-500" th:text="${#strings.length(course.description) > 80 ? #strings.substring(course.description,0,80) + '...' : course.description}"></div>
                        </td>
                        <td class="py-4 px-4" th:text="${course.trainer != null ? course.trainer.firstName + ' ' + course.trainer.lastName : '-'}"></td>
                        <td class="py-4 px-4 text-sm">
                            <div th:text="${#temporals.format(course.startDate, 'dd MMM yyyy')} + ' - ' + ${#temporals.format(course.endDate, 'dd MMM yyyy')}"></div>
                            <div class="text-gray-500" th:if="${course.daysOfWeek != null and !course.daysOfWeek.isEmpty()}" th:text="${#strings.listJoin(course.daysOfWeek, ', ')}"></div>
                        </td>
                        <td class="py-3 px-4 text-center">
                             <div class="flex items-center justify-center space-x-2">
                                <a th:href="@{/admin/courses/{id}/info(id=${course.id})}"
                                   class="bg-blue-100 text-blue-800 hover:bg-blue-200 font-bold py-2 px-4 rounded text-sm">Info</a>
                                <a th:href="@{/admin/courses/edit/{id}(id=${course.id})}"
                                   class="bg-yellow-100 text-yellow-800 hover:bg-yellow-200 font-bold py-2 px-4 rounded text-sm">Manage</a>
                                <a th:href="@{/admin/courses/delete/{id}(id=${course.id})}"
                                   class="bg-red-100 text-red-800 hover:bg-red-200 font-bold py-2 px-4 rounded text-sm"
                                   onclick="return confirm('Are you sure you want to delete this course?');">Delete</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="flex justify-between items-center mt-6">
            <div class="text-sm text-gray-700">
                Showing <span th:text="${courses.size()}"></span> of <span th:text="${totalItems}"></span> entries
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Management</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mx-auto mt-8">
    <div class="max-w-7xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Course Management</h1>
            <a class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" href="/admin/courses/new">Add Course</a>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                <tr>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Name</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Capacity</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Description</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Status</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Actions</th>
                </tr>
                </thead>
                <tbody class="text-gray-700">
                <tr th:each="course : ${coursePage.content}">
                    <td class="py-3 px-4 font-semibold" th:text="${course.name}"></td>
                    <td class="py-3 px-4" th:text="${course.capacity}"></td>
                    <td class="py-3 px-4" th:text="${#strings.length(course.description) > 80 ? #strings.substring(course.description, 0, 80) + '...' : course.description}"></td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-1 rounded text-xs font-semibold"
                              th:classappend="${course.active} ? 'bg-green-200 text-green-800' : 'bg-gray-300 text-gray-800'"
                              th:text="${course.active ? 'Active' : 'Inactive'}"></span>
                    </td>
                    <td class="py-3 px-4">
                        <div><a class="text-blue-500 hover:text-blue-700" th:href="@{/admin/courses/edit/{id}(id=${course.id})}">Edit</a></div>
                        <div><a class="text-red-500 hover:text-red-700" th:href="@{/admin/courses/delete/{id}(id=${course.id})}" onclick="return confirm('Delete course?');">Delete</a></div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="flex justify-between items-center mt-6">
            <div class="text-sm text-gray-700">
                Showing <span th:text="${coursePage.number * coursePage.size + 1}"></span> to <span th:text="${(coursePage.number * coursePage.numberOfElements)}"></span> of <span th:text="${coursePage.totalElements}"></span> entries
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Form</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex">
                <div class="flex-shrink-0 flex items-center">
                    <a class="text-2xl font-bold text-gray-800" href="/">MuskelManagement</a>
                </div>
            </div>
            <div class="flex items-center">
                <div sec:authorize="hasRole('ADMIN')">
                    <a class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium"
                       href="/admin/users">User
                        Management</a>
                </div>
                <form class="ml-4" method="post" th:action="@{/logout}">
                    <input class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit"
                           value="Logout"/>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container mx-auto mt-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold mb-6" th:if="${user.id == null}">Create User</h1>
        <h1 class="text-3xl font-bold mb-6" th:if="${user.id != null}">Edit User</h1>
        <form method="post"
              th:action="${user.id == null} ? @{/admin/users/new} : @{/admin/users/edit/{id}(id=${user.id})}" th:object="${user}">

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="firstName">First Name:</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                       id="firstName" th:field="*{firstName}" type="text"/>
                <span class="text-red-500 text-xs italic" th:errors="*{firstName}"
                      th:if="${#fields.hasErrors('firstName')}"></span>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="lastName">Last Name:</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                       id="lastName" th:field="*{lastName}" type="text"/>
                <span class="text-red-500 text-xs italic" th:errors="*{lastName}"
                      th:if="${#fields.hasErrors('lastName')}"></span>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email:</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                       id="email" th:field="*{email}" type="email"/>
                <span class="text-red-500 text-xs italic" th:errors="*{email}"
                      th:if="${#fields.hasErrors('email')}"></span>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="membershipType">Membership Type:</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                       id="membershipType" th:field="*{membershipType}" type="text"/>
                <span class="text-red-500 text-xs italic" th:errors="*{membershipType}"
                      th:if="${#fields.hasErrors('membershipType')}"></span>
            </div>
            <div class="mb-4" th:if="${user.id == null}">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password:</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                       id="password" th:field="*{password}" type="password"/>
                <span class="text-red-500 text-xs italic" th:errors="*{password}"
                      th:if="${#fields.hasErrors('password')}"></span>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">
                    <input class="mr-2 leading-tight" th:field="*{enabled}" type="checkbox"/>Enabled
                </label>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Roles:</label>
                <div class="mb-2" th:each="role : ${allRoles}">
                    <label class="inline-flex items-center">
                        <input class="form-checkbox h-5 w-5 text-blue-600" th:field="*{roles}" th:value="${role}"
                               type="checkbox"/>
                        <span class="ml-2 text-gray-700" th:text="${role}"></span>
                    </label>
                </div>
                <span class="text-red-500 text-xs italic" th:errors="*{roles}"
                      th:if="${#fields.hasErrors('roles')}"></span>
            </div>
            <div>
                <input class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" th:value="${user.id == null} ? 'Create' : 'Update'"
                       type="submit"/>
            </div>
        </form>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Management</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<!-- Include Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
<div class="container mx-auto mt-8">
    <div class="max-w-7xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">User Management</h1>
            <a class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" href="/admin/users/new">Create
                User</a>
        </div>

        <!-- Search/Filter Form -->
        <form class="mb-6 p-4 border rounded-lg bg-gray-50" method="get" th:action="@{/admin/users}">
            <input name="size" th:value="${userPage.size}" type="hidden"/>
            <input name="sort" th:if="${userPage.sort.isSorted()}" th:value="${userPage.sort.toString().replace(': ', ',')}"
                   type="hidden"/>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email:</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                           id="email" name="email" th:value="${email}" type="text"/>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="firstName">First Name:</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                           id="firstName" name="firstName" th:value="${firstName}" type="text"/>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="lastName">Last Name:</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                           id="lastName" name="lastName" th:value="${lastName}" type="text"/>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="activePlan">Active Plan:</label>
                    <select class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="activePlan" name="activePlan">
                        <option value="">All</option>
                        <option th:each="plan : ${activePlans}" th:selected="${activePlan == plan.name}" th:text="${plan.name}"
                                th:value="${plan.name}"></option>
                    </select>
                </div>
            </div>
            <div class="mt-4 flex justify-end">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        type="submit">Search
                </button>
                <a class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded ml-2"
                   th:href="@{/admin/users}">Clear</a>
            </div>
        </form>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                <tr>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">
                        <a th:href="@{/admin/users(page=${userPage.number}, size=${userPage.size}, sort='id,' + ${sortDirection}, email=${email}, firstName=${firstName}, lastName=${lastName}, activePlan=${activePlan})}"
                           th:with="sortDirection=${userPage.sort.getOrderFor('id') != null and userPage.sort.getOrderFor('id').direction.name() == 'ASC' ? 'DESC' : 'ASC'}">
                            ID (Join Date)
                            <span th:if="${userPage.sort.getOrderFor('id') != null}"
                                  th:text="${userPage.sort.getOrderFor('id').direction.name() == 'ASC' ? '↑' : '↓'}"></span>
                        </a>
                    </th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">
                        <a th:href="@{/admin/users(page=${userPage.number}, size=${userPage.size}, sort='firstName,' + ${sortDirection}, email=${email}, firstName=${firstName}, lastName=${lastName})}"
                           th:with="sortDirection=${userPage.sort.getOrderFor('firstName') != null and userPage.sort.getOrderFor('firstName').direction.name() == 'ASC' ? 'DESC' : 'ASC'}">
                            First Name
                            <span th:if="${userPage.sort.getOrderFor('firstName') != null}"
                                  th:text="${userPage.sort.getOrderFor('firstName').direction.name() == 'ASC' ? '↑' : '↓'}"></span>
                        </a>
                    </th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">
                        <a th:href="@{/admin/users(page=${userPage.number}, size=${userPage.size}, sort='lastName,' + ${sortDirection}, email=${email}, firstName=${firstName}, lastName=${lastName})}"
                           th:with="sortDirection=${userPage.sort.getOrderFor('lastName') != null and userPage.sort.getOrderFor('lastName').direction.name() == 'ASC' ? 'DESC' : 'ASC'}">
                            Last Name
                            <span th:if="${userPage.sort.getOrderFor('lastName') != null}"
                                  th:text="${userPage.sort.getOrderFor('lastName').direction.name() == 'ASC' ? '↑' : '↓'}"></span>
                        </a>
                    </th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">
                        <a th:href="@{/admin/users(page=${userPage.number}, size=${userPage.size}, sort='email,' + ${sortDirection}, email=${email}, firstName=${firstName}, lastName=${lastName}, activePlan=${activePlan})}"
                           th:with="sortDirection=${userPage.sort.getOrderFor('email') != null and userPage.sort.getOrderFor('email').direction.name() == 'ASC' ? 'DESC' : 'ASC'}">
                            Email
                            <span th:if="${userPage.sort.getOrderFor('email') != null}"
                                  th:text="${userPage.sort.getOrderFor('email').direction.name() == 'ASC' ? '↑' : '↓'}"></span>
                        </a>
                    </th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Active Plan</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Start Date</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">
                        <a th:href="@{/admin/users(page=${userPage.number}, size=${userPage.size}, sort='enabled,' + ${sortDirection}, email=${email}, firstName=${firstName}, lastName=${lastName}, activePlan=${activePlan})}"
                           th:with="sortDirection=${userPage.sort.getOrderFor('enabled') != null and userPage.sort.getOrderFor('enabled').direction.name() == 'ASC' ? 'DESC' : 'ASC'}">
                            Enabled
                            <span th:if="${userPage.sort.getOrderFor('enabled') != null}"
                                  th:text="${userPage.sort.getOrderFor('enabled').direction.name() == 'ASC' ? '↑' : '↓'}"></span>
                        </a>
                    </th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">2FA</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Roles</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Actions</th>
                </tr>
                </thead>
                <tbody class="text-gray-700">
                <tr th:classappend="${user.email == currentUsername} ? 'bg-blue-100' : ''"
                    th:each="user, i : ${userPage.content}">
                    <td class="py-3 px-4 font-mono text-sm" th:text="${user.id}"></td>
                    <td class="py-3 px-4" th:text="${user.firstName}"></td>
                    <td class="py-3 px-4" th:text="${user.lastName}"></td>
                    <td class="py-3 px-4">
                        <span th:text="${user.email}"></span>
                        <span class="font-bold text-blue-600" th:if="${user.email == currentUsername}"> (You)</span>
                    </td>
                    <td class="py-3 px-4" th:text="${user.activeSubscriptionPricingName ?: 'None'}"></td>
                    <td class="py-3 px-4"
                        th:text="${user.activeSubscriptionStartDate != null ? #temporals.format(user.activeSubscriptionStartDate, 'dd.MM.yyyy') : '-'}"></td>
                    <td class="py-3 px-4">
                        <th:block th:if="${user.email != currentUsername}">
                            <span th:classappend="${user.enabled} ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-600'"
                                  class="px-3 py-1 rounded-full text-xs font-semibold">
                                <span th:if="${user.enabled}">Active</span>
                                <span th:unless="${user.enabled}">Inactive</span>
                            </span>
                        </th:block>
                        <th:block th:if="${user.email == currentUsername}">
                            <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold">
                                ✓ Active (You)
                            </span>
                        </th:block>
                    </td>
                    <td class="py-3 px-4">
                        <span th:classappend="${user.twoFactorEnabled} ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'"
                              class="px-3 py-1 rounded-full text-xs font-semibold">
                            <span th:if="${user.twoFactorEnabled}">Enabled</span>
                            <span th:unless="${user.twoFactorEnabled}">Disabled</span>
                        </span>
                    </td>
                    <td class="py-3 px-4" th:text="${#strings.listJoin(user.roles, ', ')}"></td>
                    <td class="py-3 px-4">
                        <th:block th:if="${user.email != currentUsername}">
                            <div><a class="text-blue-500 hover:text-blue-700"
                                    th:href="@{/admin/users/edit/{id}(id=${user.id})}">Edit</a></div>
                            <div><a class="text-red-500 hover:text-red-700"
                                    th:href="@{/admin/users/delete/{id}(id=${user.id})}">Delete</a></div>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination Controls -->
        <div class="flex flex-col md:flex-row justify-between items-center mt-6 gap-4">
            <!-- Items Per Page Selector -->
            <div class="flex items-center">
                <label class="mr-2 text-gray-700 font-medium" for="pageSize">Rows per page:</label>
                <select class="border border-gray-300 rounded px-2 py-1 focus:outline-none focus:border-blue-500"
                        id="pageSize"
                        onchange="changePageSize(this.value)">
                    <option th:selected="${userPage.size == 5}" value="5">5</option>
                    <option th:selected="${userPage.size == 10}" value="10">10</option>
                    <option th:selected="${userPage.size == 15}" value="15">15</option>
                    <option th:selected="${userPage.size == 20}" value="20">20</option>
                    <option th:selected="${userPage.size == 50}" value="50">50</option>
                </select>
            </div>

            <div class="flex items-center space-x-2" th:if="${userPage.totalPages > 0}">
                <a class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 rounded-l-lg"
                   th:href="@{/admin/users(page=${userPage.number - 1}, size=${userPage.size}, sort=${userPage.sort.toString().replace(': ', ',')}, email=${email}, firstName=${firstName}, lastName=${lastName}, activePlan=${activePlan})}"
                   th:if="${userPage.hasPrevious()}">Previous</a>
                <span class="px-3 py-2 leading-tight text-gray-400 bg-white border border-gray-300 rounded-l-lg"
                      th:unless="${userPage.hasPrevious()}">Previous</span>

                <div th:each="i : ${#numbers.sequence(0, userPage.totalPages - 1)}">
                    <!-- Show limited page numbers for large lists (optional optimization, but keeping simple for now) -->
                    <a class="px-3 py-2 leading-tight border border-gray-300"
                       th:classappend="${i == userPage.number ? 'bg-blue-500 text-white' : 'text-gray-700 bg-white hover:bg-gray-100'}"
                       th:href="@{/admin/users(page=${i}, size=${userPage.size}, sort=${userPage.sort.toString().replace(': ', ',')}, email=${email}, firstName=${firstName}, lastName=${lastName}, activePlan=${activePlan})}">[[${i
                        + 1}]]</a>
                </div>

                <a class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 rounded-r-lg"
                   th:href="@{/admin/users(page=${userPage.number + 1}, size=${userPage.size}, sort=${userPage.sort.toString().replace(': ', ',')}, email=${email}, firstName=${firstName}, lastName=${lastName}, activePlan=${activePlan})}"
                   th:if="${userPage.hasNext()}">Next</a>
                <span class="px-3 py-2 leading-tight text-gray-400 bg-white border border-gray-300 rounded-r-lg"
                      th:unless="${userPage.hasNext()}">Next</span>
            </div>
            <div class="text-sm text-gray-700">
                Showing <span th:text="${userPage.number * userPage.size + 1}"></span> to <span
                    th:text="${(userPage.number * userPage.size + userPage.numberOfElements)}"></span> of <span
                    th:text="${userPage.totalElements}"></span> entries
            </div>
        </div>
    </div>
</div>

    <script th:inline="javascript">
        function changePageSize(size) {
            const urlParams = new URLSearchParams(window.location.search);
            urlParams.set('size', size);
            urlParams.set('page', 0); // Reset to first page
            window.location.search = urlParams.toString();
        }
    </script>
</div>
</div>
</body>
</html>

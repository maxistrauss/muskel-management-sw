<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Form</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
<div class="container mx-auto mt-8">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4" th:text="${course.id} == null ? 'Create Course' : 'Edit Course'"></h1>
        <form th:action="${course.id} == null ? @{/admin/courses/new} : @{/admin/courses/edit/{id}(id=${course.id})}" method="post">
            <div class="mb-4">
                <label class="block text-gray-700">Name</label>
                <input type="text" name="name" th:value="${course.name}"
                       class="w-full border rounded px-3 py-2" required/>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Trainer</label>
                <select name="trainer.id" class="w-full border rounded px-3 py-2">
                    <option value="">-- No Trainer --</option>
                    <option th:each="trainer : ${trainers}" 
                            th:value="${trainer.id}" 
                            th:text="${trainer.firstName} + ' ' + ${trainer.lastName}"
                            th:selected="${course.trainer != null && course.trainer.id == trainer.id}"></option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Room</label>
                <select name="room.id" class="w-full border rounded px-3 py-2">
                    <option value="">-- No Room --</option>
                    <option th:each="room : ${rooms}"
                            th:value="${room.id}"
                            th:text="${room.name}"
                            th:selected="${course.room != null && course.room.id == room.id}"></option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Capacity</label>
                <input type="number" name="capacity" th:value="${course.capacity}"
                       class="w-full border rounded px-3 py-2" min="0"/>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Description</label>
                <textarea name="description" class="w-full border rounded px-3 py-2" rows="6" th:text="${course.description}"></textarea>
            </div>
            <div class="mb-4">
                <label class="inline-flex items-center">
                    <input type="checkbox" name="active" th:checked="${course.active}" class="mr-2"/>
                    <span>Active</span>
                </label>
            </div>
            <div class="flex space-x-2">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" type="submit">Save</button>
                <a class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" href="/admin/courses">Cancel</a>
            </div>
        </form>
        
        <!-- Exercise Management Section (only for existing courses) -->
        <div th:if="${course.id != null}" class="mt-8 pt-8 border-t">
            <h2 class="text-xl font-bold mb-4">Manage Exercises</h2>
            
            <!-- Current Exercises -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold mb-3">Current Exercises</h3>
                <div id="current-exercises" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div th:each="exercise : ${course.exercises}"
                         class="border rounded-lg p-4 bg-white shadow-sm"
                         th:attr="data-exercise-id=${exercise.id}">
                        <div class="h-32 bg-gray-200 rounded mb-2 overflow-hidden">
                            <img th:src="${exercise.gifUrl}"
                                 th:alt="${exercise.name}"
                                 class="w-full h-full object-cover"/>
                        </div>
                        <h4 class="font-semibold capitalize mb-2" th:text="${exercise.name}"></h4>
                        <button onclick="removeExercise(this)"
                                th:attr="data-course-id=${course.id}, data-exercise-id=${exercise.id}"
                                class="w-full bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded text-sm">
                            Remove
                        </button>
                    </div>
                </div>
                <p th:if="${#sets.isEmpty(course.exercises)}" class="text-gray-500 italic">No exercises added yet.</p>
            </div>
            
            <!-- Add Exercises -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold mb-3">Add Exercises</h3>
                <div class="mb-4">
                    <a th:href="@{/member/exercises}" target="_blank"
                       class="inline-block bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                        Browse Exercise Library
                    </a>
                    <span class="ml-2 text-sm text-gray-600">or search below:</span>
                </div>
                
                <!-- Search -->
                <div class="mb-4">
                    <input type="text" id="exercise-search"
                           placeholder="Search exercises by name..."
                           class="w-full border rounded px-3 py-2"/>
                </div>
                
                <!-- Search Results -->
                <div id="exercise-search-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Results will be populated via JavaScript -->
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript" th:if="${course.id != null}">
    /*<![CDATA[*/
    const courseId = /*[[${course.id}]]*/ 0;
    let searchTimeout;
    /*]]>*/
    
    // Search exercises
    document.getElementById('exercise-search').addEventListener('input', function(e) {
        clearTimeout(searchTimeout);
        const query = e.target.value;
        
        if (query.length < 2) {
            document.getElementById('exercise-search-results').innerHTML = '';
            return;
        }
        
        searchTimeout = setTimeout(() => {
            fetch(`/api/exercises?search=${encodeURIComponent(query)}&size=6`)
                .then(res => res.json())
                .then(data => {
                    displaySearchResults(data.content);
                })
                .catch(err => console.error('Search failed:', err));
        }, 500);
    });
    
    function displaySearchResults(exercises) {
        const container = document.getElementById('exercise-search-results');
        
        if (exercises.length === 0) {
            container.innerHTML = '<p class="text-gray-500 col-span-full">No exercises found</p>';
            return;
        }
        
        container.innerHTML = exercises.map(ex => `
            <div class="border rounded-lg p-4 bg-white shadow-sm">
                <div class="h-32 bg-gray-200 rounded mb-2 overflow-hidden">
                    <img src="${ex.gifUrl}" alt="${ex.name}" class="w-full h-full object-cover"/>
                </div>
                <h4 class="font-semibold capitalize mb-2">${ex.name}</h4>
                <div class="flex gap-1 mb-2 flex-wrap">
                    <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800">${ex.bodyPart}</span>
                    <span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">${ex.equipment}</span>
                </div>
                <button onclick="addExercise(${ex.id})"
                        class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded text-sm">
                    Add to Course
                </button>
            </div>
        `).join('');
    }
    
    function addExercise(exerciseId) {
        fetch(`/api/exercises/courses/${courseId}/exercises/${exerciseId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(res => {
            if (res.ok) {
                alert('Exercise added successfully!');
                location.reload();
            } else {
                alert('Failed to add exercise');
            }
        })
        .catch(err => {
            console.error('Add failed:', err);
            alert('Failed to add exercise');
        });
    }
    
    function removeExercise(button) {
        const courseId = button.getAttribute('data-course-id');
        const exerciseId = button.getAttribute('data-exercise-id');
        
        if (!confirm('Remove this exercise from the course?')) {
            return;
        }
        
        fetch(`/api/exercises/courses/${courseId}/exercises/${exerciseId}`, {
            method: 'DELETE'
        })
        .then(res => {
            if (res.ok || res.status === 204) {
                alert('Exercise removed successfully!');
                location.reload();
            } else {
                alert('Failed to remove exercise');
            }
        })
        .catch(err => {
            console.error('Remove failed:', err);
            alert('Failed to remove exercise');
        });
    }
</script>
</body>
</html>

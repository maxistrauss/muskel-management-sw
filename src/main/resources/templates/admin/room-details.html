<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Room Details</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<!-- Include Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mx-auto mt-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold" th:text="'Room: ' + ${room.name}">Room Details</h1>
            <div class="space-x-2">
                <a class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
                   th:href="@{/admin/rooms/edit/{id}(id=${room.id})}">Edit Room</a>
                <a class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded"
                   th:href="@{/admin/rooms}">Back to List</a>
            </div>
        </div>

        <!-- Room Information -->
        <div class="mb-8">
            <h2 class="text-2xl font-semibold mb-4">Room Information</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-6 rounded-lg">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">Name:</label>
                    <p class="text-gray-900" th:text="${room.name}"></p>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">Capacity:</label>
                    <p class="text-gray-900" th:text="${room.capacity} + ' people'"></p>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-gray-700 text-sm font-bold mb-1">Amenities:</label>
                    <p class="text-gray-900" th:text="${room.amenities}" th:if="${room.amenities != null and !room.amenities.isEmpty()}"></p>
                    <p class="text-gray-500 italic" th:unless="${room.amenities != null and !room.amenities.isEmpty()}">No amenities specified</p>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">Status:</label>
                    <span class="px-3 py-1 rounded text-sm font-semibold"
                          th:classappend="${room.active} ? 'bg-green-200 text-green-800' : 'bg-gray-300 text-gray-800'"
                          th:text="${room.active ? 'Active' : 'Inactive'}"></span>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-1">Equipment Count:</label>
                    <p class="text-gray-900" th:text="${room.equipmentCount} + ' items'"></p>
                </div>
            </div>
        </div>

        <!-- Assigned Equipment -->
        <div th:if="${room.equipment != null and !room.equipment.isEmpty()}">
            <h2 class="text-2xl font-semibold mb-4">Assigned Equipment</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border rounded-lg">
                    <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="py-3 px-4 text-left uppercase font-semibold text-sm">Name</th>
                        <th class="py-3 px-4 text-left uppercase font-semibold text-sm">Serial Number</th>
                        <th class="py-3 px-4 text-left uppercase font-semibold text-sm">Status</th>
                        <th class="py-3 px-4 text-left uppercase font-semibold text-sm">Category</th>
                        <th class="py-3 px-4 text-left uppercase font-semibold text-sm">Manufacturer</th>
                        <th class="py-3 px-4 text-left uppercase font-semibold text-sm">Actions</th>
                    </tr>
                    </thead>
                    <tbody class="text-gray-700">
                    <tr th:each="equip : ${room.equipment}" class="border-b hover:bg-gray-50">
                        <td class="py-3 px-4" th:text="${equip.name}"></td>
                        <td class="py-3 px-4" th:text="${equip.serialNumber}"></td>
                        <td class="py-3 px-4">
                            <span class="px-2 py-1 rounded text-xs font-semibold"
                                  th:classappend="${equip.status.name() == 'AVAILABLE'} ? 'bg-green-200 text-green-800' : 
                                                  (${equip.status.name() == 'IN_MAINTENANCE'} ? 'bg-yellow-200 text-yellow-800' : 
                                                  (${equip.status.name() == 'DEFECTIVE'} ? 'bg-red-200 text-red-800' : 'bg-gray-300 text-gray-800'))"
                                  th:text="${equip.status.displayName}"></span>
                        </td>
                        <td class="py-3 px-4" th:text="${equip.category != null ? equip.category.displayName : '-'}"></td>
                        <td class="py-3 px-4" th:text="${equip.manufacturer ?: '-'}"></td>
                        <td class="py-3 px-4">
                            <a class="text-blue-500 hover:text-blue-700"
                               th:href="@{/admin/equipment/edit/{id}(id=${equip.id})}">Edit</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- No Equipment Message -->
        <div th:unless="${room.equipment != null and !room.equipment.isEmpty()}" class="bg-gray-50 p-6 rounded-lg text-center">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
            </svg>
            <h3 class="mt-2 text-lg font-medium text-gray-900">No Equipment Assigned</h3>
            <p class="mt-1 text-sm text-gray-500">This room currently has no equipment assigned to it.</p>
            <div class="mt-4">
                <a class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700"
                   th:href="@{/admin/equipment}">
                    Go to Equipment Management
                </a>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-8 flex justify-between border-t pt-6">
            <div class="space-x-2">
                <a class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
                   th:href="@{/admin/rooms/edit/{id}(id=${room.id})}">Edit Room</a>
                <a class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded"
                   th:if="${room.active}"
                   onclick="return confirm('Are you sure you want to deactivate this room? All equipment will be unassigned.');"
                   th:href="@{/admin/rooms/deactivate/{id}(id=${room.id})}">Deactivate</a>
            </div>
            <a class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded"
               onclick="return confirm('Are you sure you want to delete this room? All equipment will be unassigned. This action cannot be undone.');"
               th:href="@{/admin/rooms/delete/{id}(id=${room.id})}">Delete Room</a>
        </div>
    </div>
</div>
</body>
</html>

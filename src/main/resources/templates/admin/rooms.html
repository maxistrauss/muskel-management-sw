<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Room Management</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<!-- Include Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
<div class="container mx-auto mt-8">
    <div class="max-w-7xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Room Management</h1>
            <a class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" href="/admin/rooms/new">Add Room</a>
        </div>

        <!-- Search/Filter Form -->
        <form class="mb-6 p-4 border rounded-lg bg-gray-50" method="get" th:action="@{/admin/rooms}">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="name">Name:</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                           id="name" name="name" th:value="${name}" type="text"/>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="minCapacity">Min Capacity:</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                           id="minCapacity" name="minCapacity" th:value="${minCapacity}" type="number" min="0"/>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="maxCapacity">Max Capacity:</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                           id="maxCapacity" name="maxCapacity" th:value="${maxCapacity}" type="number" min="0"/>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="active">Status:</label>
                    <select class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="active" name="active">
                        <option value="">All</option>
                        <option th:value="true" th:selected="${active == true}">Active</option>
                        <option th:value="false" th:selected="${active == false}">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="mt-4 flex justify-end">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        type="submit">Search
                </button>
                <a class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded ml-2"
                   th:href="@{/admin/rooms}">Clear</a>
            </div>
        </form>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                <tr>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Name</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Capacity</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Amenities</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Equipment</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Status</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Actions</th>
                </tr>
                </thead>
                <tbody class="text-gray-700">
                <tr th:classappend="${!room.active} ? 'bg-gray-200' : ''"
                    th:each="room : ${roomPage.content}">
                    <td class="py-3 px-4 font-semibold" th:text="${room.name}"></td>
                    <td class="py-3 px-4" th:text="${room.capacity}"></td>
                    <td class="py-3 px-4">
                        <span th:if="${room.amenities != null and !room.amenities.isEmpty()}"
                              th:text="${#strings.length(room.amenities) > 50 ? #strings.substring(room.amenities, 0, 50) + '...' : room.amenities}"></span>
                        <span th:unless="${room.amenities != null and !room.amenities.isEmpty()}">-</span>
                    </td>
                    <td class="py-3 px-4">
                        <a class="text-blue-500 hover:text-blue-700"
                           th:href="@{/admin/rooms/view/{id}(id=${room.id})}"
                           th:text="${room.equipmentCount + ' items'}"></a>
                    </td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-1 rounded text-xs font-semibold"
                              th:classappend="${room.active} ? 'bg-green-200 text-green-800' : 'bg-gray-300 text-gray-800'"
                              th:text="${room.active ? 'Active' : 'Inactive'}"></span>
                    </td>
                    <td class="py-3 px-4">
                        <div><a class="text-blue-500 hover:text-blue-700"
                                th:href="@{/admin/rooms/edit/{id}(id=${room.id})}">Edit</a></div>
                        <div th:if="${room.active}">
                            <a class="text-orange-500 hover:text-orange-700"
                               onclick="return confirm('Are you sure you want to deactivate this room? All equipment will be unassigned.');"
                               th:href="@{/admin/rooms/deactivate/{id}(id=${room.id})}">Deactivate</a>
                        </div>
                        <div><a class="text-red-500 hover:text-red-700"
                                onclick="return confirm('Are you sure you want to delete this room? All equipment will be unassigned.');"
                                th:href="@{/admin/rooms/delete/{id}(id=${room.id})}">Delete</a></div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination Controls -->
        <div class="flex justify-between items-center mt-6">
            <div class="flex items-center space-x-2" th:if="${roomPage.totalPages > 0}">
                <a class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 rounded-l-lg"
                   th:href="@{/admin/rooms(page=${roomPage.number - 1}, size=${roomPage.size}, name=${name}, minCapacity=${minCapacity}, maxCapacity=${maxCapacity}, active=${active})}"
                   th:if="${roomPage.hasPrevious()}">Previous</a>
                <span class="px-3 py-2 leading-tight text-gray-400 bg-white border border-gray-300 rounded-l-lg"
                      th:unless="${roomPage.hasPrevious()}">Previous</span>

                <div th:each="i : ${#numbers.sequence(0, roomPage.totalPages - 1)}">
                    <a class="px-3 py-2 leading-tight border border-gray-300"
                       th:classappend="${i == roomPage.number ? 'bg-blue-500 text-white' : 'text-gray-700 bg-white hover:bg-gray-100'}"
                       th:href="@{/admin/rooms(page=${i}, size=${roomPage.size}, name=${name}, minCapacity=${minCapacity}, maxCapacity=${maxCapacity}, active=${active})}">[[${i + 1}]]</a>
                </div>

                <a class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 rounded-r-lg"
                   th:href="@{/admin/rooms(page=${roomPage.number + 1}, size=${roomPage.size}, name=${name}, minCapacity=${minCapacity}, maxCapacity=${maxCapacity}, active=${active})}"
                   th:if="${roomPage.hasNext()}">Next</a>
                <span class="px-3 py-2 leading-tight text-gray-400 bg-white border border-gray-300 rounded-r-lg"
                      th:unless="${roomPage.hasNext()}">Next</span>
            </div>
            <div class="text-sm text-gray-700">
                Showing <span th:text="${roomPage.number * roomPage.size + 1}"></span> to <span
                    th:text="${(roomPage.number * roomPage.size + roomPage.numberOfElements)}"></span> of <span
                    th:text="${roomPage.totalElements}"></span> entries
            </div>
        </div>
    </div>
</div>
</body>
</html>

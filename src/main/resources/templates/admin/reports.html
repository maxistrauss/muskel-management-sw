<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reports</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
    <div class="container mx-auto p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Reports & Statistics</h1>
            <a class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" href="/admin/reports/new">
                Create New Report
            </a>
        </div>

        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="min-w-full leading-normal">
                <thead>
                <tr>
                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                        Name
                    </th>
                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                        Type
                    </th>
                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                        Created At
                    </th>
                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">
                        Actions
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="report : ${reportPage.content}">
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                        <p class="text-gray-900 whitespace-no-wrap font-semibold" th:text="${report.name}"></p>
                    </td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                        <span class="relative inline-block px-3 py-1 font-semibold text-green-900 leading-tight">
                            <span aria-hidden="true"
                                  class="absolute inset-0 bg-green-200 opacity-50 rounded-full"></span>
                            <span class="relative" th:text="${report.type}"></span>
                        </span>
                    </td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                        <p class="text-gray-900 whitespace-no-wrap"
                           th:text="${#temporals.format(report.createdAt, 'dd.MM.yyyy HH:mm')}"></p>
                    </td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm text-center">
                        <div class="flex item-center justify-center gap-2">
                            <a class="text-blue-600 hover:text-blue-900"
                               th:href="@{/admin/reports/view/{id}(id=${report.id})}">
                                View
                            </a>
                            <a class="text-yellow-600 hover:text-yellow-900"
                               th:href="@{/admin/reports/edit/{id}(id=${report.id})}">
                                Edit
                            </a>
                            <a class="text-red-600 hover:text-red-900"
                               onclick="return confirm('Delete this report?')"
                               th:href="@{/admin/reports/delete/{id}(id=${report.id})}">
                                Delete
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="p-6 text-center text-gray-500 italic" th:if="${reportPage.empty}">
                No reports found. Create one to get started!
            </div>
        </div>
    </div>
</div>
</body>
</html>

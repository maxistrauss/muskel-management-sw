<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<!-- Include Sidebar Navigation Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Main Content Area (with left margin for sidebar) -->
<div class="lg:ml-64">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold mb-6">Welcome to MuskelManagement!</h1>

        <div sec:authorize="isAuthenticated()">
            <p class="text-lg">Welcome, <span class="font-semibold"
                                              th:text="${#authentication.principal.username}"></span>!</p>
            <p class="text-lg">Your roles are: <span class="font-semibold"
                                                     th:text="${#authentication.principal.authorities}"></span></p>

            <div sec:authorize="hasRole('ADMIN')" class="mt-6">
                <h2 class="text-2xl font-bold mb-4">Admin Functions</h2>
                <div class="flex flex-col space-y-3">
                    <a class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded text-center"
                       href="/admin/users">User Management</a>
                    <a class="bg-green-500 hover:bg-green-700 text-white font-bold py-3 px-6 rounded text-center"
                       href="/admin/pricing">Pricing Management</a>
                </div>
            </div>
        </div>
    </div>
    </div>
</div>

</body>
</html>

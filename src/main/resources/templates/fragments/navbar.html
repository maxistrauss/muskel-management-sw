<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
    <!DOCTYPE html>
<head>
    <title>Navbar Fragment</title>
</head>
<body>
<!-- Sidebar Navigation Fragment -->
<div th:fragment="navbar">
    <!-- Mobile Menu Toggle Button (Fixed Top-Left) -->
    <button
        id="sidebar-toggle"
        class="lg:hidden fixed top-4 left-4 z-50 p-2 rounded-md bg-gray-800 text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        aria-label="Toggle sidebar">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <!-- Sidebar -->
    <aside
        id="sidebar"
        class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full lg:translate-x-0 bg-gray-800 shadow-lg"
        aria-label="Sidebar">
        <div th:with="isSuperUser=${#authorization.expression('hasRole(''MEMBER'') and hasRole(''TRAINER'') and hasRole(''ADMIN'')')}"
             class="h-full flex flex-col px-3"
             th:classappend="${isSuperUser ? 'py-1' : 'py-4'}">
            <!-- Logo/Brand -->
            <div class="flex items-center justify-center mb-6 pb-4 border-b border-gray-700">
                <a href="/" class="text-xl font-bold text-white hover:text-gray-300 transition-colors">
                    MuskelManagement
                </a>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1" th:classappend="${isSuperUser ? 'space-y-0' : 'space-y-2'}">
                <!-- Member Menu -->
                <div sec:authorize="hasRole('MEMBER')">
                    <p class="px-3 py-1 text-xs font-semibold text-gray-400 uppercase tracking-wider">Member</p>
                    <a
                        href="/"
                        th:classappend="${currentUri == '/' ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                        </svg>
                        Home
                    </a>
                    <a
                        href="/member/course-info"
                        th:classappend="${currentUri.contains('/member/course-info') and !currentUri.contains('/member/course-info/my') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                        Course Overview
                    </a>
                    <a
                        href="/member/course-info/my"
                        th:classappend="${currentUri.contains('/member/course-info/my') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                        My Courses
                    </a>
                    <a
                        href="/member/exercises"
                        th:classappend="${currentUri.contains('/member/exercises') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
                        </svg>
                        Exercises
                    </a>
                    <a
                        href="/member/subscriptions"
                        th:classappend="${currentUri.contains('/member/subscriptions') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        My Subscription
                    </a>
                    <a
                        href="/member/plans"
                        th:classappend="${currentUri.contains('/member/plans') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" stroke-linecap="round" stroke-linejoin="round"
                                  stroke-width="2"></path>
                        </svg>
                        My Training Plans
                    </a>
                    <a
                        href="/member/measurements"
                        th:classappend="${currentUri.contains('/member/measurements') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round"
                                  stroke-width="2"></path>
                        </svg>
                        My Progress
                    </a>
                    <a
                        href="/member/reviews"
                        th:classappend="${currentUri.contains('/member/reviews') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" stroke-linecap="round" stroke-linejoin="round"
                                  stroke-width="2"></path>
                        </svg>
                        My Reviews
                    </a>
                </div>

                <!-- Trainer Menu -->
                <div sec:authorize="hasRole('TRAINER')" th:classappend="${isSuperUser ? 'pt-1' : 'pt-2'}">
                    <p class="px-3 py-1 text-xs font-semibold text-gray-400 uppercase tracking-wider">Trainer</p>
                    <a
                        href="/trainer/members"
                        th:classappend="${currentUri.contains('/trainer/members') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round"
                                  stroke-width="2"></path>
                        </svg>
                        Members (Plans)
                    </a>
                    <a
                        href="/trainer/courses"
                        th:classappend="${currentUri.contains('/trainer/courses') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        My Courses
                    </a>
                </div>

                <!-- Admin Menu -->
                <div sec:authorize="hasRole('ADMIN')" th:classappend="${isSuperUser ? 'pt-1' : 'pt-2'}">
                    <p class="px-3 py-1 text-xs font-semibold text-gray-400 uppercase tracking-wider">Admin</p>
                    <a
                        href="/admin/users"
                        th:classappend="${currentUri.contains('/admin/users') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        User Management
                    </a>
                    <a
                        href="/admin/equipment"
                        th:classappend="${currentUri.contains('/admin/equipment') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
                        </svg>
                        Equipment
                    </a>
                    <a
                        href="/admin/rooms"
                        th:classappend="${currentUri.contains('/admin/rooms') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                        </svg>
                        Rooms
                    </a>
                    <a
                        href="/admin/pricing"
                        th:classappend="${currentUri.contains('/admin/pricing') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
                        </svg>
                        Pricing Management
                    </a>
                    <a
                        href="/admin/membership-confirmations"
                        th:classappend="${currentUri.contains('/admin/membership-confirmations') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        Membership Confirmations
                    </a>
                    <a
                        href="/admin/courses"
                        th:classappend="${currentUri.contains('/admin/courses') ? 'bg-gray-700 text-white' : ''}"
                        th:class="|flex items-center px-3 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        Course Management
                    </a>
                </div>
            </nav>

            <!-- User Profile Section (Bottom of Sidebar) -->
            <div sec:authorize="isAuthenticated()"
                 th:class="|border-t border-gray-700 ${isSuperUser ? 'pt-1 mt-2' : 'pt-4 mt-auto'}|">
                <a
                    href="/profile"
                    class="flex items-center px-3 group"
                    th:classappend="|text-gray-300 rounded-lg hover:bg-gray-700 transition-colors ${isSuperUser ? 'py-2' : 'py-3'}|">
                    <div class="flex items-center justify-center w-10 h-10 mr-3 rounded-full bg-blue-600 text-white font-semibold group-hover:bg-blue-500">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-white truncate" th:text="${currentUserFullName}">User Name</p>
                        <p class="text-xs text-gray-400 truncate" th:text="${currentUserEmail}">user@email.com</p>
                    </div>
                </a>

                <!-- Logout Button -->
                <form method="post" th:action="@{/logout}" class="mt-2">
                    <button
                        type="submit"
                        th:class="|w-full flex items-center px-3 text-gray-300 rounded-lg hover:bg-red-600 hover:text-white transition-colors ${isSuperUser ? 'py-1' : 'py-2'}|">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </aside>

    <!-- Backdrop for mobile -->
    <div
        id="sidebar-backdrop"
        class="fixed inset-0 z-30 bg-gray-900 bg-opacity-50 hidden lg:hidden"
        aria-hidden="true"></div>

    <!-- JavaScript for sidebar toggle -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebarBackdrop = document.getElementById('sidebar-backdrop');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebarBackdrop.classList.toggle('hidden');
        }

        sidebarToggle.addEventListener('click', toggleSidebar);
        sidebarBackdrop.addEventListener('click', toggleSidebar);

        // Close sidebar on escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && !sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        });
    </script>
</div>

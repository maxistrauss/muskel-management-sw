<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Navbar Fragment</title>
</head>
<body>
<!-- Navigation Bar Fragment -->
<nav class="bg-white shadow-md" th:fragment="navbar">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <a class="text-2xl font-bold text-gray-800" href="/">MuskelManagement</a>
                </div>
                <div class="hidden md:flex md:ml-6 md:space-x-4 items-center">
                    <a class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium" href="/">Home</a>
                    <a class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium" href="/courses">Courses</a>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <!-- User Profile Icon -->
                <a href="/profile"
                   class="flex items-center justify-center h-10 w-10 rounded-full text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                   th:title="${currentUserEmail}">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </a>
                
                <!-- Burger Menu Button -->
                <button class="inline-flex items-center justify-center p-2 rounded-md text-gray-700 hover:text-gray-900 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
                        id="mobile-menu-button" type="button" aria-expanded="false">
                    <span class="sr-only">Open main menu</span>
                    <!-- Icon when menu is closed -->
                    <svg class="block h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                
                <!-- Logout Button -->
                <form method="post" th:action="@{/logout}">
                    <input class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline cursor-pointer"
                           type="submit" value="Logout"/>
                </form>
            </div>
        </div>
    </div>

    <!-- Mobile Menu (Hidden by default) -->
    <div class="hidden" id="mobile-menu">
        <!-- Admin Menu -->
        <div class="px-2 pt-2 pb-3 space-y-1 bg-gray-50 border-t border-gray-200" sec:authorize="hasRole('ADMIN')">
            <div class="px-3 py-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">Admin</div>
            <a class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-200"
               href="/admin/users"
               th:classappend="${currentUri.contains('/admin/users') ? 'bg-gray-200 text-gray-900' : ''}">
                User Management
            </a>
            <a class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-200"
               href="/admin/equipment"
               th:classappend="${currentUri.contains('/admin/equipment') ? 'bg-gray-200 text-gray-900' : ''}">
                Equipment Management
            </a>
            <a class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-200"
               href="/admin/rooms"
               th:classappend="${currentUri.contains('/admin/rooms') ? 'bg-gray-200 text-gray-900' : ''}">
                Room Management
            </a>
            <a class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-200"
               href="/admin/tarifs"
               th:classappend="${currentUri.contains('/admin/tarifs') ? 'bg-gray-200 text-gray-900' : ''}">
                Tarif Management
            </a>
            <a class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-200"
               href="/admin/courses"
               th:classappend="${currentUri.contains('/admin/courses') ? 'bg-gray-200 text-gray-900' : ''}">
                Kurs Management
            </a>
        </div>

        <!-- Trainer Menu -->
        <div class="px-2 pt-2 pb-3 space-y-1 bg-gray-50 border-t border-gray-200" sec:authorize="hasRole('TRAINER')">
            <div class="px-3 py-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">Trainer</div>
            <a class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-200"
               href="/trainer/courses"
               th:classappend="${currentUri.contains('/trainer/courses') ? 'bg-gray-200 text-gray-900' : ''}">
                My Courses
            </a>
        </div>
        
        <!-- Member Menu -->
        <div class="px-2 pt-2 pb-3 space-y-1 bg-gray-50 border-t border-gray-200" sec:authorize="hasRole('MEMBER')">
            <div class="px-3 py-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">Member</div>
            <a class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-200"
               href="/member/subscriptions"
               th:classappend="${currentUri.contains('/member/subscriptions') ? 'bg-gray-200 text-gray-900' : ''}">
                My Subscription
            </a>
            <a class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-200"
               href="/member/tarifs"
               th:classappend="${currentUri.contains('/member/tarifs') ? 'bg-gray-200 text-gray-900' : ''}">
                Browse Plans
            </a>
        </div>
    </div>

    <!-- JavaScript to toggle mobile menu -->
    <script>
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('mobile-menu');
            const button = document.getElementById('mobile-menu-button');
            
            if (!menu.contains(event.target) && !button.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });
    </script>
</nav>
</body>
</html>

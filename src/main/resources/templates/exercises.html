<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Exercise Library</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="lg:ml-64">
<div class="container mx-auto mt-8 px-4">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h1 class="text-3xl font-bold mb-4">Exercise Library</h1>
            
            <!-- Search Bar -->
            <form method="get" th:action="@{/member/exercises}" class="mb-4">
                <div class="flex gap-2">
                    <input type="text" name="search" th:value="${search}" 
                           placeholder="Search exercises..." 
                           class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">
                        Search
                    </button>
                    <a th:href="@{/member/exercises}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded">
                        Clear
                    </a>
                </div>
            </form>
            
            <!-- Filters -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Body Part Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Body Part</label>
                    <select onchange="location = '/member/exercises?bodyPart=' + this.value"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">All Body Parts</option>
                        <option th:each="bp : ${bodyParts}" 
                                th:value="${bp}" 
                                th:text="${bp}"
                                th:selected="${bp == bodyPart}"></option>
                    </select>
                </div>
                
                <!-- Equipment Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Equipment</label>
                    <select onchange="location = '/member/exercises?equipment=' + this.value"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">All Equipment</option>
                        <option th:each="equipmentType : ${equipmentTypes}"
                                th:value="${equipmentType}"
                                th:text="${equipmentType}"
                                th:selected="${equipmentType == equipment}"></option>
                    </select>
                </div>
                
                <!-- Target Muscle Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Target Muscle</label>
                    <select onchange="location = '/member/exercises?target=' + this.value"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">All Targets</option>
                        <option th:each="t : ${targets}" 
                                th:value="${t}" 
                                th:text="${t}"
                                th:selected="${t == target}"></option>
                    </select>
                </div>
            </div>
            
            <!-- Active Filters Display -->
            <div th:if="${!#strings.isEmpty(search)
         or !#strings.isEmpty(bodyPart)
         or !#strings.isEmpty(equipment)
         or !#strings.isEmpty(target)}"
                 class="mt-4 flex gap-2 flex-wrap">
                <span class="text-sm text-gray-600">Active filters:</span>
                <span th:if="${search}" class="inline-flex items-center px-3 py-1 rounded-full text-sm bg-blue-100 text-blue-800">
                    Search: <span th:text="${search}" class="ml-1 font-medium"></span>
                    <a th:href="@{/member/exercises}" class="ml-2 text-blue-600 hover:text-blue-800">×</a>
                </span>
                <span th:if="${bodyPart}" class="inline-flex items-center px-3 py-1 rounded-full text-sm bg-green-100 text-green-800">
                    Body Part: <span th:text="${bodyPart}" class="ml-1 font-medium"></span>
                    <a th:href="@{/member/exercises}" class="ml-2 text-green-600 hover:text-green-800">×</a>
                </span>
                <span th:if="${equipment}" class="inline-flex items-center px-3 py-1 rounded-full text-sm bg-purple-100 text-purple-800">
                    Equipment: <span th:text="${equipment}" class="ml-1 font-medium"></span>
                    <a th:href="@{/member/exercises}" class="ml-2 text-purple-600 hover:text-purple-800">×</a>
                </span>
                <span th:if="${target}" class="inline-flex items-center px-3 py-1 rounded-full text-sm bg-orange-100 text-orange-800">
                    Target: <span th:text="${target}" class="ml-1 font-medium"></span>
                    <a th:href="@{/member/exercises}" class="ml-2 text-orange-600 hover:text-orange-800">×</a>
                </span>
            </div>
        </div>
        
        <!-- Exercise Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
            <div th:each="exercise : ${exercisePage.content}" 
                 class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow">
                <!-- Exercise GIF -->
                <div class="h-48 bg-gray-200 flex items-center justify-center overflow-hidden">
                    <img th:src="${exercise.gifUrl}" 
                         th:alt="${exercise.name}" 
                         loading="lazy"
                         class="w-full h-full object-cover cursor-pointer hover:scale-105 transition-transform"
                         th:onclick="'window.location.href=\'/member/exercises/' + ${exercise.id} + '\''"/>
                </div>
                
                <!-- Exercise Info -->
                <div class="p-4">
                    <h3 class="text-lg font-semibold mb-2 capitalize" th:text="${exercise.name}"></h3>
                    
                    <!-- Tags -->
                    <div class="flex flex-wrap gap-2 mb-3">
                        <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800 capitalize" 
                              th:text="${exercise.bodyPart}"></span>
                        <span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800 capitalize" 
                              th:text="${exercise.equipment}"></span>
                        <span class="px-2 py-1 text-xs rounded-full bg-purple-100 text-purple-800 capitalize" 
                              th:text="${exercise.target}"></span>
                    </div>
                    
                    <!-- View Details Button -->
                    <a th:href="@{/member/exercises/{id}(id=${exercise.id})}"
                       class="block w-full text-center bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                        View Details
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Pagination -->
        <div th:if="${!#lists.isEmpty(exercisePage.content)}" class="bg-white p-4 rounded-lg shadow-md">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <!-- Results Info & Page Size Selector -->
                <div class="flex items-center gap-4">
                    <div class="text-sm text-gray-600">
                        Showing <span class="font-semibold" th:text="${exercisePage.numberOfElements}"></span> of
                        <span class="font-semibold" th:text="${exercisePage.totalElements}"></span> exercises
                    </div>
                    
                    <!-- Page Size Selector -->
                    <div class="flex items-center gap-2">
                        <label for="pageSize" class="text-sm text-gray-600">Show:</label>
                        <select id="pageSize"
                                onchange="window.location.href = this.value"
                                class="px-3 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option th:value="@{/member/exercises(size=5, search=${search}, bodyPart=${bodyPart}, equipment=${equipment}, target=${target})}"
                                    th:selected="${exercisePage.size == 5}">5</option>
                            <option th:value="@{/member/exercises(size=10, search=${search}, bodyPart=${bodyPart}, equipment=${equipment}, target=${target})}"
                                    th:selected="${exercisePage.size == 10}">10</option>
                            <option th:value="@{/member/exercises(size=15, search=${search}, bodyPart=${bodyPart}, equipment=${equipment}, target=${target})}"
                                    th:selected="${exercisePage.size == 15}">15</option>
                        </select>
                        <span class="text-sm text-gray-600">per page</span>
                    </div>
                </div>
                
                <!-- Pagination Controls -->
                <div class="flex justify-center items-center gap-2">
                    <!-- Previous Button -->
                    <a th:if="${!exercisePage.first}"
                       th:href="@{/member/exercises(page=${exercisePage.number - 1}, size=${exercisePage.size}, search=${search}, bodyPart=${bodyPart}, equipment=${equipment}, target=${target})}"
                       class="px-4 py-2 bg-blue-500 hover:bg-blue-700 text-white rounded">
                        Previous
                    </a>
                    <span th:if="${exercisePage.first}" class="px-4 py-2 bg-gray-200 text-gray-400 rounded cursor-not-allowed">
                        Previous
                    </span>
                    
                    <!-- Page Numbers -->
                    <span class="px-4 py-2 font-medium">
                        Page <span th:text="${exercisePage.number + 1}"></span> of <span th:text="${exercisePage.totalPages}"></span>
                    </span>
                    
                    <!-- Next Button -->
                    <a th:if="${!exercisePage.last}"
                       th:href="@{/member/exercises(page=${exercisePage.number + 1}, size=${exercisePage.size}, search=${search}, bodyPart=${bodyPart}, equipment=${equipment}, target=${target})}"
                       class="px-4 py-2 bg-blue-500 hover:bg-blue-700 text-white rounded">
                        Next
                    </a>
                    <span th:if="${exercisePage.last}" class="px-4 py-2 bg-gray-200 text-gray-400 rounded cursor-not-allowed">
                        Next
                    </span>
                </div>
            </div>
        </div>
        
        <!-- No Results Message -->
        <div th:if="${#lists.isEmpty(exercisePage.content)}" class="bg-white p-8 rounded-lg shadow-md text-center">
            <p class="text-gray-600 text-lg">No exercises found matching your criteria.</p>
            <a th:href="@{/member/exercises}" class="mt-4 inline-block text-blue-500 hover:text-blue-700">
                Clear filters and view all exercises
            </a>
        </div>
    </div>
</div>
</body>
</html>

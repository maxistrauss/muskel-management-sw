<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">

<!-- Include Sidebar Navigation Fragment only if authenticated -->
<div sec:authorize="isAuthenticated()">
    <div th:replace="fragments/navbar :: navbar"></div>
</div>

<div th:class="${#authorization.expression('isAuthenticated()')} ? 'lg:ml-64' : ''">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-2xl w-full bg-white p-8 rounded-lg shadow-lg text-center">
            <div class="mb-6">
                <svg class="w-24 h-24 text-red-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"></path>
                </svg>
            </div>

            <h1 class="text-4xl font-bold text-gray-800 mb-4">Something went wrong</h1>

            <div class="mb-6 bg-red-50 border border-red-200 rounded p-4">
                <div class="flex items-center justify-center gap-2 mb-2">
                    <span class="text-2xl font-bold text-red-600" th:text="${status}">Error</span>
                    <span class="text-gray-400">|</span>
                    <span class="text-xl text-red-700" th:text="${error}">Unknown Error</span>
                </div>
                <p class="text-gray-600" th:text="${message}">An unexpected error occurred.</p>
            </div>

            <div class="flex justify-center gap-4">
                <a class="flex items-center bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition duration-300"
                   href="/">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2"></path>
                    </svg>
                    Go Home
                </a>
                <button class="flex items-center bg-gray-500 text-white px-6 py-2 rounded hover:bg-gray-600 transition duration-300"
                        onclick="history.back()">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2"></path>
                    </svg>
                    Go Back
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>

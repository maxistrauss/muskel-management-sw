<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Courses</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <h1 class="text-3xl font-bold mb-6">My Courses</h1>
            <p class="text-gray-600 mb-6">Here are the courses you are currently enrolled in.</p>
            
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-800 text-white">
                        <tr>
                            <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Course Name</th>
                            <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Trainer</th>
                            <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Schedule</th>
                            <th class="py-3 px-4 uppercase font-semibold text-sm text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-700">
                        <tr th:each="course : ${enrolledCoursePage.content}" class="border-b hover:bg-gray-50">
                            <td class="py-4 px-4">
                                <div class="font-semibold" th:text="${course.name}"></div>
                                <div class="text-xs text-gray-500" th:text="${#strings.length(course.description) > 80 ? #strings.substring(course.description,0,80) + '...' : course.description}"></div>
                            </td>
                            <td class="py-4 px-4" th:text="${course.trainer != null ? course.trainer.firstName + ' ' + course.trainer.lastName : '-'}"></td>
                            <td class="py-4 px-4 text-sm">
                                <div th:text="${#temporals.format(course.startDate, 'dd MMM yyyy')} + ' - ' + ${#temporals.format(course.endDate, 'dd MMM yyyy')}"></div>
                                <div class="text-gray-500" th:if="${course.daysOfWeek != null and !course.daysOfWeek.isEmpty()}" th:text="${#strings.listJoin(course.daysOfWeek, ', ')}"></div>
                            </td>
                            <td class="py-4 px-4">
                                <div class="flex items-center justify-end space-x-2">
                                    <a th:href="@{/member/course-info/{id}(id=${course.id})}" class="bg-blue-100 text-blue-800 hover:bg-blue-200 font-bold py-2 px-3 rounded text-xs">Info</a>
                                    <form th:action="@{/member/course-info/{id}/unenroll(id=${course.id})}" method="post" class="inline">
                                        <button type="submit" class="bg-red-100 text-red-800 hover:bg-red-200 font-bold py-2 px-3 rounded text-xs">Unenroll</button>
                                    </form>
                                    <a th:href="@{/member/course-info/{id}/reviews/new(id=${course.id})}" class="bg-yellow-100 text-yellow-800 hover:bg-yellow-200 font-bold py-2 px-3 rounded text-xs">Review</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(enrolledCoursePage.content)}" class="text-center py-8">
                <p class="text-gray-600">You are not enrolled in any courses yet.</p>
                <a href="/member/course-info" class="mt-4 inline-block bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Browse Available Courses</a>
            </div>

            <!-- Pagination -->
            <div th:if="${enrolledCoursePage.totalPages > 1}" class="mt-8 flex justify-center">
                <nav aria-label="Pagination">
                    <ul class="flex items-center space-x-2">
                        <li th:if="${enrolledCoursePage.number > 0}">
                            <a class="px-3 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-10"
                               th:href="@{/member/course-info/my(page=${enrolledCoursePage.number - 1}, size=${enrolledCoursePage.size})}">Previous</a>
                        </li>
                        
                        <li th:each="i : ${#numbers.sequence(0, enrolledCoursePage.totalPages - 1)}"
                            th:class="${i == enrolledCoursePage.number ? 'px-3 py-2 bg-blue-500 border border-gray-300 text-white rounded' : 'px-3 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-100'}">
                            <a th:href="@{/member/course-info/my(page=${i}, size=${enrolledCoursePage.size})}" th:text="${i + 1}"></a>
                        </li>
                        
                        <li th:if="${enrolledCoursePage.number < enrolledCoursePage.totalPages - 1}">
                            <a class="px-3 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-100"
                               th:href="@{/member/course-info/my(page=${enrolledCoursePage.number + 1}, size=${enrolledCoursePage.size})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
</body>
</html>

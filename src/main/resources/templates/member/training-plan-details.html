<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${plan.name}">Plan Details</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
    <div class="container mx-auto mt-8 p-4">
        <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <div class="mb-6 border-b pb-4">
                <div class="flex justify-between items-center">
                    <h1 class="text-3xl font-bold text-gray-800" th:text="${plan.name}">Plan Name</h1>
                    <span class="text-gray-500 font-semibold" th:text="'Version ' + ${plan.version}">v1</span>
                </div>
                <p class="text-gray-600 mt-2" th:text="${plan.description}">Description</p>
            </div>

            <div class="space-y-4">
                <div class="bg-gray-50 p-4 rounded-lg border flex flex-col md:flex-row gap-4 items-start md:items-center"
                     th:each="ex : ${plan.exercises}">
                    <img alt="Exercise" class="w-20 h-20 object-cover rounded bg-white" th:if="${ex.exercise.gifUrl}"
                         th:src="${ex.exercise.gifUrl}">
                    <div class="flex-grow">
                        <h3 class="text-lg font-bold text-blue-700" th:text="${ex.exercise.name}">Exercise Name</h3>
                        <div class="text-sm text-gray-600 flex gap-4 mt-1">
                            <span><span class="font-bold">Sets:</span> <span th:text="${ex.sets}">3</span></span>
                            <span><span class="font-bold">Reps:</span> <span th:text="${ex.reps}">12</span></span>
                        </div>
                        <p class="text-sm text-gray-500 mt-2 italic" th:if="${ex.notes}">
                            Note: <span th:text="${ex.notes}">Notes...</span>
                        </p>
                    </div>
                    <div class="flex-shrink-0">
                        <a class="text-blue-500 hover:text-blue-700 text-sm"
                           th:href="@{/member/exercises/{id}(id=${ex.exercise.id})}">Details</a>
                    </div>
                </div>
            </div>

            <div class="mt-8">
                <a class="text-gray-600 hover:text-gray-800" th:href="@{/member/plans}">&larr; Back to Plans</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>

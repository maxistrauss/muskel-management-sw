<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Reviews</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
    <div class="container mx-auto mt-8 p-4">
        <div class="max-w-7xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <h1 class="text-3xl font-bold mb-6">My Course Reviews</h1>

            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Course</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Rating</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Comment</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Date</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Actions</th>
                    </tr>
                    </thead>
                    <tbody class="text-gray-700">
                    <tr class="border-b hover:bg-gray-50" th:each="review : ${reviews}">
                        <td class="py-3 px-4 font-semibold">
                            <a class="text-blue-600 hover:underline"
                               th:href="@{/courses/{id}(id=${review.course.id})}"
                               th:text="${review.course.name}">Course Name</a>
                        </td>
                        <td class="py-3 px-4">
                            <div class="flex text-yellow-400">
                                <span th:each="i : ${#numbers.sequence(1, 5)}">
                                    <span th:if="${review.rating >= i}">★</span>
                                    <span class="text-gray-300" th:unless="${review.rating >= i}">★</span>
                                </span>
                            </div>
                        </td>
                        <td class="py-3 px-4 max-w-md truncate" th:text="${review.comment}"></td>
                        <td class="py-3 px-4 text-sm text-gray-500"
                            th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy')}"></td>
                        <td class="py-3 px-4 flex gap-2">
                            <a class="text-blue-600 hover:text-blue-800 font-semibold"
                               th:href="@{/member/reviews/{id}/edit(id=${review.id})}">Edit</a>

                            <form method="post" onsubmit="return confirm('Are you sure you want to delete this review?');"
                                  th:action="@{/member/reviews/{id}/delete(id=${review.id})}">
                                <button class="text-red-600 hover:text-red-800 font-semibold" type="submit">Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(reviews)}">
                        <td class="py-8 text-center text-gray-500" colspan="5">
                            You haven't written any reviews yet.
                            <a class="text-blue-600 hover:underline" href="/member/courses">Go to courses</a> to add
                            one!
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>

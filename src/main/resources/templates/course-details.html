<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${course.name}">Course Details</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mx-auto mt-8">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold" th:text="${course.name}"></h1>
        <p class="text-gray-700 mt-4" th:text="${course.description}"></p>
        <p class="text-sm text-gray-500 mt-2">Capacity: <span th:text="${course.capacity}"></span></p>
        <p class="text-sm text-gray-500 mt-1">Room: <span th:text="${course.room != null ? course.room.name : '-'}"></span></p>

        <div class="mt-6">
            <form th:if="${!enrolled}" th:action="@{/courses/{id}/enroll(id=${course.id})}" method="post">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Enroll</button>
            </form>
            <form th:if="${enrolled}" th:action="@{/courses/{id}/unenroll(id=${course.id})}" method="post">
                <button class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Unenroll</button>
            </form>
        </div>

        <div class="mt-6">
            <h3 class="font-semibold">Participants</h3>
            <ul>
                <li th:each="e : ${course.enrollments}" th:text="${e.user.firstName + ' ' + e.user.lastName + ' - ' + e.attendanceStatus}"></li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>

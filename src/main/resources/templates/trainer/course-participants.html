<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Course Participants - ' + ${course.name}">Course Participants</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mx-auto mt-8">
    <div class="max-w-7xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold" th:text="'Participants in ' + ${course.name}"></h1>
            <a class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded" th:href="@{/trainer/courses/{id}/add-member(id=${course.id})}">Add Member</a>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                <tr>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">First Name</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Last Name</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Email</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Attendance</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Actions</th>
                </tr>
                </thead>
                <tbody class="text-gray-700">
                <tr th:each="enrollment : ${enrollments}">
                    <td class="py-3 px-4" th:text="${enrollment.user.firstName}"></td>
                    <td class="py-3 px-4" th:text="${enrollment.user.lastName}"></td>
                    <td class="py-3 px-4" th:text="${enrollment.user.email}"></td>
                    <td class="py-3 px-4" th:text="${enrollment.attendanceStatus}"></td>
                    <td class="py-3 px-4">
                        <form th:action="@{/trainer/courses/{id}/remove-member/{userId}(id=${course.id}, userId=${enrollment.user.id})}" method="post" style="display:inline;">
                            <button class="text-red-500 hover:text-red-700" type="submit" onclick="return confirm('Remove member?');">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-6">
            <a class="text-blue-500 hover:text-blue-700" th:href="@{/trainer/courses}">Back to Courses</a>
        </div>
    </div>
</div>
</body>
</html>

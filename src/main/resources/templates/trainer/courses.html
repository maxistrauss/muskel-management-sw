<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Courses</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
<div class="container mx-auto mt-8">
    <div class="max-w-7xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold mb-6">My Courses</h1>
        
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                <tr>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Name</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Capacity</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Enrolled</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Status</th>
                    <th class="py-3 px-4 uppercase font-semibold text-sm">Actions</th>
                </tr>
                </thead>
                <tbody class="text-gray-700">
                <tr th:each="course : ${coursePage.content}">
                    <td class="py-3 px-4 font-semibold" th:text="${course.name}"></td>
                    <td class="py-3 px-4" th:text="${course.capacity}"></td>
                    <td class="py-3 px-4" th:text="${course.enrollments.size()}"></td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-1 rounded text-xs font-semibold"
                              th:classappend="${course.active} ? 'bg-green-200 text-green-800' : 'bg-gray-300 text-gray-800'"
                              th:text="${course.active ? 'Active' : 'Inactive'}"></span>
                    </td>
                    <td class="py-3 px-4">
                        <div><a class="text-blue-500 hover:text-blue-700" th:href="@{/trainer/courses/{id}/participants(id=${course.id})}">View Participants</a></div>
                        <div><a class="text-green-500 hover:text-green-700" th:href="@{/trainer/courses/{id}/add-member(id=${course.id})}">Add Member</a></div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

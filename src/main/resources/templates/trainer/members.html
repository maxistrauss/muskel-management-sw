<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Members</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
    <div class="container mx-auto mt-8 p-4">
        <div class="max-w-7xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <h1 class="text-3xl font-bold mb-6">Members</h1>

            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Name</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Email</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Actions</th>
                    </tr>
                    </thead>
                    <tbody class="text-gray-700">
                    <tr class="border-b hover:bg-gray-50" th:each="user : ${userPage.content}">
                        <td class="py-3 px-4 font-semibold" th:text="${user.firstName} + ' ' + ${user.lastName}"></td>
                        <td class="py-3 px-4" th:text="${user.email}"></td>
                        <td class="py-3 px-4 flex gap-2">
                            <a class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700"
                               th:href="@{/trainer/members/{id}/plans(id=${user.id})}">
                                Plans
                            </a>
                            <a class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700"
                               th:href="@{/trainer/members/{id}/measurements(id=${user.id})}">
                                Measurements
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination could go here -->
        </div>
    </div>
</div>
</body>
</html>

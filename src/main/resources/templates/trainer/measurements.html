<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fitness Measurements</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
    <div class="container mx-auto mt-8 p-4">
        <div class="max-w-7xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold">Measurements for <span
                        th:text="${member.firstName} + ' ' + ${member.lastName}">Member</span></h1>
                <a class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
                   th:href="@{/trainer/members/{id}/measurements/create(id=${member.id})}">
                    New Measurement
                </a>
            </div>

            <!-- Graph Container -->
            <div class="mb-8 bg-gray-50 p-4 rounded-lg">
                <canvas height="150" id="progressChart" width="400"></canvas>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Date</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Weight (kg)</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Body Fat %</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Muscle Mass %</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Notes</th>
                        <th class="py-3 px-4 uppercase font-semibold text-sm text-left">Actions</th>
                    </tr>
                    </thead>
                    <tbody class="text-gray-700">
                    <tr class="border-b hover:bg-gray-50" th:each="m : ${measurements}">
                        <td class="py-3 px-4" th:text="${#temporals.format(m.date, 'dd.MM.yyyy')}"></td>
                        <td class="py-3 px-4" th:text="${m.weight}"></td>
                        <td class="py-3 px-4" th:text="${m.bodyFatPercentage}"></td>
                        <td class="py-3 px-4" th:text="${m.muscleMassPercentage}"></td>
                        <td class="py-3 px-4 text-sm text-gray-600 truncate max-w-xs" th:text="${m.notes}"></td>
                        <td class="py-3 px-4 flex gap-2">
                            <a class="text-blue-600 hover:text-blue-800 font-semibold"
                               th:href="@{/trainer/measurements/{id}/edit(id=${m.id})}">Edit</a>

                            <form method="post" onsubmit="return confirm('Are you sure you want to delete this entry?');"
                                  th:action="@{/trainer/measurements/{id}/delete(id=${m.id})}">
                                <button class="text-red-600 hover:text-red-800 font-semibold" type="submit">Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(measurements)}">
                        <td class="py-4 text-center text-gray-500" colspan="6">No measurements found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const measurements = /*[[${measurements}]]*/ [];

    if (measurements.length > 0) {
        // Sort by date ascending for the chart
        const sorted = [...measurements].sort((a, b) => new Date(a.date) - new Date(b.date));

        const dates = sorted.map(m => new Date(m.date).toLocaleDateString());
        const weights = sorted.map(m => m.weight);
        const bodyFats = sorted.map(m => m.bodyFatPercentage);
        const muscleMass = sorted.map(m => m.muscleMassPercentage);

        const ctx = document.getElementById('progressChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: 'Weight (kg)',
                        data: weights,
                        borderColor: 'rgb(59, 130, 246)',
                        tension: 0.1
                    },
                    {
                        label: 'Body Fat (%)',
                        data: bodyFats,
                        borderColor: 'rgb(239, 68, 68)',
                        tension: 0.1,
                        yAxisID: 'y1'
                    },
                    {
                        label: 'Muscle Mass (%)',
                        data: muscleMass,
                        borderColor: 'rgb(34, 197, 94)',
                        tension: 0.1,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {display: true, text: 'Weight (kg)'}
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        grid: {
                            drawOnChartArea: false,
                        },
                        title: {display: true, text: 'Body Fat (%)'}
                    }
                }
            }
        });
    }
    /*]]>*/
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Form</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="lg:ml-64">
<div class="container mx-auto mt-8">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <!-- Success Message -->
        <div th:if="${successMessage}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" role="alert">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                </svg>
                <span th:text="${successMessage}"></span>
            </div>
        </div>
        
        <!-- Error Message -->
        <div th:if="${errorMessage}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                </svg>
                <span th:text="${errorMessage}"></span>
            </div>
        </div>
        
        <h1 class="text-2xl font-bold mb-4" th:text="${course.id} == null ? 'Create Course' : 'Edit Course'"></h1>
        <form th:action="${course.id} == null ? @{/trainer/courses/new} : @{/trainer/courses/edit/{id}(id=${course.id})}" method="post">
            <div class="mb-4">
                <label class="block text-gray-700">Name</label>
                <input type="text" name="name" th:value="${course.name}"
                       class="w-full border rounded px-3 py-2" required/>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Room</label>
                <select name="room.id" class="w-full border rounded px-3 py-2">
                    <option value="">-- No Room --</option>
                    <option th:each="room : ${rooms}"
                            th:value="${room.id}"
                            th:text="${room.name}"
                            th:selected="${course.room != null && course.room.id == room.id}"></option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Capacity</label>
                <input type="number" name="capacity" th:value="${course.capacity}"
                       class="w-full border rounded px-3 py-2" min="0"/>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Description</label>
                <textarea name="description" class="w-full border rounded px-3 py-2" rows="6" th:text="${course.description}"></textarea>
            </div>
            <div class="mb-4">
                <label class="inline-flex items-center">
                    <input type="checkbox" name="active" th:checked="${course.active}" class="mr-2"/>
                    <span>Active</span>
                </label>
            </div>
            <div class="flex space-x-2">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" type="submit">Save</button>
                <a class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" href="/trainer/courses">Cancel</a>
            </div>
        </form>
    </div>
</div>
</div>

</body>
</html>

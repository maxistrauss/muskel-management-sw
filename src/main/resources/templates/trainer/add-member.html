<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Add Member to ' + ${course.name}">Add Member</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mx-auto mt-8">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4" th:text="'Add Member to ' + ${course.name}"></h1>
        
        <form th:action="@{/trainer/courses/{id}/add-member(id=${course.id})}" method="post">
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">Select User</label>
                <select name="userId" class="w-full border rounded px-3 py-2" required>
                    <option value="">-- Choose a user --</option>
                    <option th:each="user : ${availableUsers}" th:value="${user.id}" th:text="${user.firstName + ' ' + user.lastName + ' (' + user.email + ')'}"></option>
                </select>
            </div>
            <div class="flex space-x-2">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" type="submit">Add Member</button>
                <a class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" th:href="@{/trainer/courses/{id}/participants(id=${course.id})}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

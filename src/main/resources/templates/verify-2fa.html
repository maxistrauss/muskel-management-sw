<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>2FA Verification</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="bg-gray-100">
<div class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold mb-2">Two-Factor Authentication</h1>
            <div class="flex items-center justify-center mb-4">
                <svg class="w-16 h-16 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
        </div>

        <!-- Success Message -->
        <div th:if="${success}" 
             class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
            <span th:text="${success}"></span>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" 
             class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <strong class="font-bold">Error!</strong>
            <span class="block sm:inline" th:text="${error}"></span>
        </div>

        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6">
            <p class="text-gray-700 text-sm">
                <strong>📧 Email sent to:</strong><br/>
                <span class="font-mono text-blue-600" th:text="${email}"></span>
            </p>
            <p class="text-gray-600 text-xs mt-2">
                The code is valid for <strong>5 minutes</strong>.
            </p>
        </div>

        <form method="post" th:action="@{/verify-2fa}">
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">
                    Verification Code:
                </label>
                <input 
                    type="text" 
                    name="code" 
                    maxlength="4" 
                    pattern="[0-9]{4}"
                    required
                    autofocus
                    autocomplete="off"
                    class="shadow appearance-none border rounded w-full py-3 px-3 text-gray-700 text-center text-3xl tracking-[0.5em] font-bold focus:outline-none focus:shadow-outline focus:border-blue-500"
                    placeholder="••••"/>
                <p class="text-gray-600 text-xs mt-2 text-center">
                    Enter the 4-digit code from the email
                </p>
            </div>

            <div th:if="${remainingAttempts != null && remainingAttempts > 0}" 
                 class="bg-yellow-50 border-l-4 border-yellow-400 p-3 mb-4">
                <p class="text-yellow-700 text-sm">
                    <strong>Remaining attempts:</strong> 
                    <span th:text="${remainingAttempts}"></span>
                </p>
            </div>

            <button type="submit" 
                    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded w-full mb-4 transition duration-200">
                ✓ Verify
            </button>
        </form>

        <div class="border-t pt-4">
            <p class="text-gray-600 text-sm text-center mb-3">
                Didn't receive code?
            </p>
            <form method="post" th:action="@{/verify-2fa/resend}">
                <button type="submit" 
                        class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded w-full transition duration-200">
                    📨 Request New Code
                </button>
            </form>
        </div>

        <div class="text-center mt-6">
            <a th:href="@{/login}" class="text-blue-500 hover:text-blue-700 text-sm">
                ← Back to Login
            </a>
        </div>

        <div class="bg-gray-50 rounded p-3 mt-6">
            <p class="text-gray-600 text-xs text-center">
                <strong>🔒 Security Note:</strong><br/>
                Never share this code with anyone.
            </p>
        </div>
    </div>
</div>

<script>
// Auto-focus and auto-submit when 4 digits entered
document.addEventListener('DOMContentLoaded', function() {
    const input = document.querySelector('input[name="code"]');
    if (input) {
        input.addEventListener('input', function(e) {
            // Only allow numbers
            this.value = this.value.replace(/[^0-9]/g, '');
            
            // Auto-submit when 4 digits entered
            if (this.value.length === 4) {
                this.form.submit();
            }
        });
    }
});
</script>
</body>
</html>

services:
  muskelmanagement:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muskelmanagement-app
    ports:
      - "8080:8080"
    environment:
      # Spring Profile (optional)
      - SPRING_PROFILES_ACTIVE=prod
      # H2 Database configuration
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/muskelmanagement
      # Mail Configuration (optional - mit deinen Werten)
      - SPRING_MAIL_HOST=sandbox.smtp.mailtrap.io
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=f6db00ce5cfbb8
      - SPRING_MAIL_PASSWORD=9100ab5936e050
    volumes:
      # Persistente Datenbank
      - muskelmanagement-data:/app/data
      # Persistente PDF Confirmations
      - muskelmanagement-pdfs:/app/pdf-confirmations
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  muskelmanagement-data:
    driver: local
  muskelmanagement-pdfs:
    driver: local

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id "com.github.node-gradle.node" version "7.0.2"
}

group = 'de.oth'
version = '0.0.1-SNAPSHOT'
description = 'MuskelManagement'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // PDF Generation with OpenHTMLToPDF
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-slf4j:1.0.10'
}

node {
    download = true
    version = "20.15.1"
    npmVersion = "10.8.2"
}

task installTailwind(type: NpmTask) {
    args = ['install', 'tailwindcss']
}

task buildTailwind(type: NpxTask) {
    command = "tailwindcss"
    args = ["-i", "src/main/resources/static/css/input.css", "-o", "build/resources/main/static/css/output.css"]
}

tasks.named("processResources") {
    dependsOn "buildTailwind"
}

tasks.named('test') {
    useJUnitPlatform()
}
